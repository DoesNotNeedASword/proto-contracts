name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно для breaking

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.0"

      - name: Lint
        run: buf lint

      - name: Format check
        run: buf format -d --exit-code

      - name: Breaking check
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Generate
        run: buf generate

      - name: Verify generated code is committed
        run: |
          if [ -n "$(git status --porcelain gen openapi)" ]; then
            echo "Generated code is out of date. Run 'make generate' and commit."
            git diff --stat gen openapi
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify module builds
        run: go build ./...